[project]
name = "engineering-manager-agent"
version = "0.1.0"
description = "Engineering Manager Agent™ — team leadership and delivery planning"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40.0", "fastapi>=0.115.0", "uvicorn[standard]>=0.32.0", "pydantic>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
engineering-manager-agent = "engineering_manager_agent.cli:main"
engineering-manager-api = "engineering_manager_agent.api.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["engineering_manager_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
