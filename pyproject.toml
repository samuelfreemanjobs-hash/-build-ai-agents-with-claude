[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoborder-comply"
version = "0.1.0"
description = "USMCA Regional Value Content calculation engine for automotive suppliers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "neo4j>=5.25.0",
    "reportlab>=4.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "openai>=1.54.0",
]

[project.optional-dependencies]
sap = ["pyrfc>=3.3"]
oracle = ["oracledb>=2.5.0"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.7.0"]

[project.scripts]
autoborder = "autoborder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autoborder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
