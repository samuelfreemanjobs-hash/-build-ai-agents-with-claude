[project]
name = "agent-runtime"
version = "0.1.0"
description = "Shared framework orchestration, harness runner, MCP routing, and model/infra signals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "anthropic>=0.40.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]