[project]
name = "principal-software-engineer"
version = "0.1.0"
description = "Principal Software Engineer Agent™ — architecture design backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
principal-software-engineer = "principal_software_engineer.cli:main"
principal-software-engineer-api = "principal_software_engineer.api.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["principal_software_engineer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
