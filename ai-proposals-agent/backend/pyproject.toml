[project]
name = "ai-proposals-agent"
version = "2.1.0"
description = "AI Proposals Agent™ — logistics proposal generation backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ai-proposals = "ai_proposals_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_proposals_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
