name: Deploy Freeman Intelligence to GitHub Pages

on:
  push:
    branches: [main, cursor/freeman-intelligence-wris-64d3]
    paths:
      - 'freeman-intelligence/web/**'
      - '.github/workflows/deploy-freeman-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fi-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freeman-intelligence/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: freeman-intelligence/web/package-lock.json

      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /-build-ai-agents-with-claude/freeman-intelligence/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: freeman-intelligence/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
