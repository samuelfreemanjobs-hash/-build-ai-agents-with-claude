name: Architect Daily Headline Learning

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install The Architect
        run: pip install -e .

      - name: Run daily headline learning
        run: the-architect learn --limit 20

      - name: Commit memory updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agents/the-architect/memory/
          if git diff --staged --quiet; then
            echo "No new learnings to commit."
          else
            git commit -m "chore(architect): daily headline swipe learning $(date -u +%Y-%m-%d)"
            git push
          fi
