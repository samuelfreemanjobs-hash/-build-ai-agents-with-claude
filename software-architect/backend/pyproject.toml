[project]
name = "software-architect"
version = "0.1.0"
description = "Software Architect Agent™ — C4 modeling and architecture governance"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40.0", "fastapi>=0.115.0", "uvicorn[standard]>=0.32.0", "pydantic>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
software-architect = "software_architect.cli:main"
software-architect-api = "software_architect.api.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["software_architect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
